                <stop offset=".28" stop-color="#6481a8"/>
                <stop offset=".58" stop-color="#7778a8"/>
                <stop offset=".76" stop-color="#8f6c97"/>

              <path id="oa-wave-fall" d="M0 23C17 24 24 37 37 32S57 14 70 18S82 23 88 23"/>
              <path id="oa-wave-undertow" d="M0 23C18 21 27 29 42 26S60 18 73 22S84 23 88 23"/>

              <use href="#oa-wave-rise" stroke-width="8" opacity=".72" filter="url(#oa-wave-halo)"/>

              <use href="#oa-wave-rise" stroke-width="1.1" opacity=".76"/>
              <use class="oa-wave-trace" href="#oa-wave-rise" stroke-width="3.6" stroke-linecap="round" filter="url(#oa-wave-halo)"/>
            </g>
            <g class="oa-wave-strand oa-wave-strand-echo" stroke="url(#oa-wave-echo)">
              <use href="#oa-wave-fall" stroke-width="7" opacity=".65" filter="url(#oa-wave-halo)"/>
              <use href="#oa-wave-fall" stroke-width="1.1" opacity=".72"/>
            </g>
            <g class="oa-wave-strand oa-wave-strand-undertow" stroke="url(#oa-wave-mineral)">

              <use href="#oa-wave-undertow" stroke-width=".65" opacity=".63"/>

name: Dés·ir — web checks

on:
  push:
    paths:
      - 'demo-des/**'
      - '.github/workflows/desir-web.yml'
  pull_request:
    paths:
      - 'demo-des/**'
      - '.github/workflows/desir-web.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  game-and-client:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Game, private worlds, transport and notifications
        run: |
          set -e
          for test in demo-des/dev/tests/*.cjs; do node "$test"; done
          node demo-des/server/tests/backend-check.mjs
          node demo-des/server/tests/push-check.mjs
          node demo-des/server/tests/hardcore-check.mjs
      - name: Rebuild the connected web release
        run: |
          python3 demo-des/dev/tests/onde-build-check.py
          python3 demo-des/dev/build.py --release
          git diff --exit-code -- demo-des/index.html demo-des/server/functions/desir-game/core.js

      - name: PostgreSQL quota, session and reset regressions
        run: |
          set -e
          npm install --prefix "$RUNNER_TEMP/desir-db-check" --ignore-scripts --no-audit --no-fund @electric-sql/pglite@0.5.14
          export DESIR_PGLITE_DIR="$RUNNER_TEMP/desir-db-check/node_modules/@electric-sql/pglite"
          node demo-des/server/tests/postgres-check.mjs
          node demo-des/server/tests/daily-quota-check.mjs
          node demo-des/server/tests/reset-game-check.mjs

  deploy:
    runs-on: ubuntu-latest
    needs: game-and-client
    if: vars.DESIR_DEPLOY == 'true'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Deploy desir-game with the committed engine
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -e
          mkdir -p supabase/functions
          cp -r demo-des/server/functions/desir-game supabase/functions/desir-game
          printf 'project_id = "rdsritcfhwcobqdjcndm"\n\n[functions.desir-game]\nverify_jwt = false\n' > supabase/config.toml
          supabase functions deploy desir-game --project-ref rdsritcfhwcobqdjcndm

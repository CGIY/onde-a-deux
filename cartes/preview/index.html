<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="connect-src 'none'; form-action 'none'; base-uri 'self'"><title>Légendaires · Aperçu animé</title><link rel="stylesheet" href="legendary.css"></head>
<body><header><span>LES CARTES À DEUX · APERÇU</span><h1>Un autre éclat.</h1><p>Concept animé · aucun effet sur votre partie</p></header>
<nav aria-label="Catégorie légendaire"><button data-theme="couple" aria-pressed="true">En couple</button><button data-theme="other" aria-pressed="false">Pour l’autre</button><button data-theme="nude" aria-pressed="false">Mise à nue</button><button data-theme="foodies" aria-pressed="false">Les foodies</button><button data-theme="todo" aria-pressed="false">To do</button></nav>
<main><div class="legend-shell" id="legendShell"><div class="aura" aria-hidden="true"></div><div class="orbit" aria-hidden="true"></div><div class="motes" id="motes" aria-hidden="true"></div><div class="legend-motion"><button class="legend-face" id="legendFace" aria-label="Choisir un défi de la légendaire"><span class="light" aria-hidden="true"></span><span class="effect-panel"><small id="effectLabel">Un défi, à ton choix</small><strong id="effectLine"></strong><span class="tap-hint">Toucher pour choisir</span></span></button></div></div>
<button class="choose-button" id="chooseButton">Choisir mon défi <span aria-hidden="true">✧</span></button><p class="gesture-hint">Passe le doigt sur la carte.</p><a class="back-link" href="../index.html">Retour aux Cartes →</a></main>
<dialog id="choiceDialog" aria-labelledby="choiceTitle"><button class="close" id="closeChoice" aria-label="Fermer">×</button><small>LA LÉGENDAIRE · <span id="choiceCategory"></span></small><h2 id="choiceTitle">À toi de choisir.</h2><div id="choices"></div><p>Ce choix est un essai visuel. Aucune carte n’est activée.</p></dialog>
<script src="legendary.js"></script></body></html>
